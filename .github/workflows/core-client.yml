name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Read package version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create tarball
        run: |
          tar -czf my-project-${VERSION}.tar.gz dist

      - uses: actions/upload-artifact@v4
        with:
          name: my-project-${{ env.VERSION }}
          path: my-project-${{ env.VERSION }}.tar.gz
