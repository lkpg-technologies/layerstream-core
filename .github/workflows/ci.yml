name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        env:
          VITE_MACHINE_CLIENT_API: http://localhost:8080
          VITE_SYMLINK_NAME: current
          VITE_POLL_TIMEOUT_SECONDS: 10
        run: npm run build
