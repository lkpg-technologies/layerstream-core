name: Build and Release on Production Merge

on:
  pull_request:
    types: [closed]
    branches: [production]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Extract version from PR title
        id: version
        run: |
          # Expects PR title like "Release v1.2.3"
          VERSION=$(echo "${{ github.event.pull_request.title }}" | grep -oP 'v\d+\.\d+\.\d+' || true)

          if [ -z "$VERSION" ]; then
            echo "Invalid PR title: '${{ github.event.pull_request.title }}'"
            echo "Expected format: Release v1.2.3"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create tarball
        run: |
          tar -czf core-client-${VERSION}.tar.gz dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ github.event.pull_request.body }}
          target_commitish: production
          files: |
            core-client-${{ env.VERSION }}.tar.gz
