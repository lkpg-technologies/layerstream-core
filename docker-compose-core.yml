services:
  frontend:
    # Keep in sync with .nvmrc
    image: "node:24-alpine"
    restart: "no"
    # Host networking exposes Vite on 5173 directly; `ports` is ignored in this mode
    network_mode: "host"
    volumes:
      - .:/core-client
    command: ["sh", "-c", "cd /core-client && npm ci && npm run dev"]
